[package]
name = "moonjang_ga"
version = "1.0.0"
description = "Moonjang-ga mobile writing community"
authors = ["js603"]
edition = "2021"

[lib]
name = "moonjang_ga_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
