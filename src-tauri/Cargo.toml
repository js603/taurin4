[package]
name = "taurin4"
version = "0.1.0"
description = "taurin4 - AI-friendly Tauri v2 starter for Web/PWA, Windows, Android and iOS"
authors = ["you"]
edition = "2021"

[lib]
name = "taurin4_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
taurin4-game-server-core = { path = "../crates/game-server-core" }
