[package]
name = "taurin4"
version = "0.1.0"
description = "taurin4 - AI-friendly Tauri v2 starter for Web/PWA, Windows, Android and iOS"
authors = ["you"]
edition = "2021"

[lib]
name = "taurin4_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
embedded-openmmo = ["dep:onlinerpg-server", "dep:tokio"]

[build-dependencies]
# Keep the build helper on the exact line paired with Tauri 2.11.6. Its
# published caret range otherwise resolves to tauri-build 2.7.x in fresh CI.
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.6", features = [] }
# Tauri 2.11.6 publishes its internal dependencies with caret-compatible
# ranges. A lockfile-free resolution therefore mixes 2.11.6 with newer
# 2.12/2.10/2.7 internals, which are API-incompatible. Constrain the exact
# internal line shipped by the tauri-v2.11.6 release.
tauri-runtime = "=2.11.3"
tauri-runtime-wry = { version = "=2.11.4", default-features = false }
tauri-macros = "=2.6.3"
tauri-codegen = { version = "=2.6.3", default-features = false }
tauri-utils = "=2.9.3"
tauri-plugin-store = "=2.4.5"
tauri-plugin-websocket = "=2.4.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
taurin4-game-server-core = { path = "../crates/game-server-core" }
onlinerpg-server = { path = "openmmo/server", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"], optional = true }
