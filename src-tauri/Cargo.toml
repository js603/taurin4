[package]
name = "taurin4"
version = "0.1.0"
description = "taurin4 - AI-friendly Tauri v2 starter for Web/PWA, Windows, Android and iOS"
authors = ["you"]
edition = "2021"

[lib]
name = "taurin4_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
embedded-openmmo = ["dep:onlinerpg-server", "dep:tokio"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.6", features = [] }
# Tauri 2.11.6 declares these with caret-compatible ranges. Pin the matching
# runtime line explicitly so a lockfile-free CI resolution cannot select the
# API-incompatible 2.12 runtime release.
tauri-runtime = "=2.11.3"
tauri-runtime-wry = { version = "=2.11.4", default-features = false }
tauri-plugin-store = "=2.4.5"
tauri-plugin-websocket = "=2.4.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
taurin4-game-server-core = { path = "../crates/game-server-core" }
onlinerpg-server = { path = "openmmo/server", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"], optional = true }
