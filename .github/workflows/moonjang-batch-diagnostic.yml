name: Moonjang Batch Diagnostic

on:
  push:
    branches: ["moonjang-ga-mobile"]
    paths:
      - ".github/workflows/moonjang-batch-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  VITE_INTERNAL_TEST: "false"
  VITE_STANDALONE: "true"
  VITE_API_BASE: https://api.moonjang.invalid

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Restore standalone source
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/restore-moonjang-standalone.sh
      - name: Apply 1.0.3 batch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/pending/moonjang-1.0.3.part*.b64 > /tmp/moonjang-1.0.3.patch.gz.b64
          base64 -d /tmp/moonjang-1.0.3.patch.gz.b64 > /tmp/moonjang-1.0.3.patch.gz
          gzip -dc /tmp/moonjang-1.0.3.patch.gz > /tmp/moonjang-1.0.3.patch
          (cd moonjang-production && patch -p0 < /tmp/moonjang-1.0.3.patch)
          (cd moonjang-production && patch -p0 < ../.github/pending/moonjang-1.0.3-e2e-status-fix.patch)
      - name: Inspect refresh wiring
        working-directory: moonjang-production
        shell: bash
        run: |
          echo '--- refresh functions ---'
          grep -n -A35 -B10 'refreshAll\|refreshCollections\|contentRevision' src/App.tsx || true
          echo '--- Library usage ---'
          grep -n -A12 -B12 '<Library' src/App.tsx || true
          echo '--- Library declaration ---'
          grep -n -A28 -B5 'function Library' src/App.tsx || true
          echo '--- feed usage ---'
          grep -n -A20 -B10 'function Home\|function Today\|<PostCard' src/App.tsx || true
