name: idea2 Android OpenMMO Client

on:
  push:
    branches: ["idea2"]
    paths:
      - "src-tauri/**"
      - "src/App.tsx"
      - "src/app/platformRuntime.ts"
      - "src/openmmo/**"
      - "src/features/game/ui/OpenMmoBootstrap.tsx"
      - "package.json"
      - ".github/workflows/idea2-android-openmmo.yml"
  pull_request:
    branches: ["idea2"]
    paths:
      - "src-tauri/**"
      - "src/App.tsx"
      - "src/app/platformRuntime.ts"
      - "src/openmmo/**"
      - "src/features/game/ui/OpenMmoBootstrap.tsx"
      - "package.json"
      - ".github/workflows/idea2-android-openmmo.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: idea2-android-openmmo-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-openmmo:
    name: Android OpenMMO standalone APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android,wasm32-unknown-unknown

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Resolve Android NDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          if [ ! -d "$ANDROID_HOME/ndk" ] || [ -z "$(ls -A "$ANDROID_HOME/ndk" 2>/dev/null)" ]; then
            NDK_PACKAGE="$(sdkmanager --list | awk '/^  ndk;[0-9]/{print $1}' | sort -V | tail -n 1)"
            test -n "$NDK_PACKAGE"
            sdkmanager "$NDK_PACKAGE"
          fi
          NDK_VERSION="$(ls -1 "$ANDROID_HOME/ndk" | sort -V | tail -n 1)"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "Using NDK $NDK_VERSION"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Frontend and transport quality
        run: npm run check

      - name: Initialize Android project
        run: npm run android:init -- --ci

      - name: Build installable standalone Android debug APK
        run: npm run android:build:debug -- --ci

      - name: Verify APK contains authoritative embedded core
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          test -f dist/openmmo-wasm/onlinerpg_shared.js
          test -f dist/openmmo-wasm/onlinerpg_shared_bg.wasm

          CHECK_DIR="$RUNNER_TEMP/taurin4-android-core-check"
          mkdir -p "$CHECK_DIR"
          unzip -o "$APK" 'lib/arm64-v8a/libtaurin4_lib.so' -d "$CHECK_DIR" >/dev/null
          strings "$CHECK_DIR/lib/arm64-v8a/libtaurin4_lib.so" |
            grep -Fq 'The server is shutting down. Please reconnect shortly.'

      - name: Stage Android OpenMMO APK
        run: |
          python3 scripts/ci/stage_artifacts.py \
            --dest artifacts/android-openmmo-debug \
            "src-tauri/gen/android/app/build/outputs/apk/**/*.apk"

      - name: Upload Android OpenMMO APK
        uses: actions/upload-artifact@v4
        with:
          name: idea2-android-standalone-debug-apk
          path: artifacts/android-openmmo-debug/
          if-no-files-found: error
          retention-days: 14
