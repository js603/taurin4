name: idea2 M3-D OpenMMO Tauri Link

on:
  pull_request:
    branches: ["idea2"]
    paths:
      - ".github/workflows/idea2-m3d-openmmo-tauri-link.yml"
      - "src-tauri/**"
      - "src/openmmo/embeddedHost.ts"
      - "scripts/prepare-openmmo-embedded.py"
      - "scripts/ci/extract_openmmo_server_lib.py"
      - "package.json"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  embedded-openmmo-tauri:
    name: Real OpenMMO core linked into Tauri Android
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout taurin4
        uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Resolve Android NDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          if [ ! -d "$ANDROID_HOME/ndk" ] || [ -z "$(ls -A "$ANDROID_HOME/ndk" 2>/dev/null)" ]; then
            NDK_PACKAGE="$(sdkmanager --list | awk '/^  ndk;[0-9]/{print $1}' | sort -V | tail -n 1)"
            test -n "$NDK_PACKAGE"
            sdkmanager "$NDK_PACKAGE"
          fi
          NDK_VERSION="$(ls -1 "$ANDROID_HOME/ndk" | sort -V | tail -n 1)"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_LLVM_TOOLCHAIN=$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_ENV"
          echo "Using NDK $NDK_VERSION"

      - name: Install Linux Tauri system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Quality gate
        run: npm run check

      - name: Prepare exact pinned embedded OpenMMO source
        run: npm run openmmo:embedded:prepare

      - name: Verify exact source pin and generated library boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C src-tauri/openmmo rev-parse HEAD)" = "950e081c178d920c10c51f2d31f60c1b3383c925"
          test -f src-tauri/openmmo/server/src/lib.rs
          grep -q 'pub async fn run_embedded_server' src-tauri/openmmo/server/src/lib.rs
          grep -q 'EmbeddedServerReady' src-tauri/openmmo/server/src/lib.rs

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri/openmmo
            src-tauri

      - name: Execute Tauri controller against real pinned authoritative core
        shell: bash
        run: |
          set -euo pipefail
          cargo test \
            --manifest-path src-tauri/Cargo.toml \
            --features embedded-openmmo \
            real_pinned_core_starts_stops_and_reuses_persistent_token \
            -- --nocapture 2>&1 | tee embedded-tauri-controller-test.log
          grep -q 'test openmmo_embedded::tests::real_pinned_core_starts_stops_and_reuses_persistent_token ... ok' embedded-tauri-controller-test.log

      - name: Configure Android ARM64 linker
        shell: bash
        run: |
          set -euo pipefail
          API=26
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$ANDROID_LLVM_TOOLCHAIN/aarch64-linux-android${API}-clang" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$ANDROID_LLVM_TOOLCHAIN/aarch64-linux-android${API}-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$ANDROID_LLVM_TOOLCHAIN/llvm-ar" >> "$GITHUB_ENV"
          test -x "$ANDROID_LLVM_TOOLCHAIN/aarch64-linux-android${API}-clang"

      - name: Check feature-linked Tauri library for Android ARM64
        run: |
          cargo check \
            --manifest-path src-tauri/Cargo.toml \
            --features embedded-openmmo \
            --target aarch64-linux-android

      - name: Initialize Android project
        run: npm run tauri -- android init --ci

      - name: Build actual Android APK with authoritative core linked
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts/m3d-tauri-link
          set +e
          npm run tauri -- android build --debug --apk --ci --features embedded-openmmo --target aarch64 \
            2>&1 | tee artifacts/m3d-tauri-link/android-apk-build.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo '::group::Android APK build failure tail'
            tail -n 250 artifacts/m3d-tauri-link/android-apk-build.log
            echo '::endgroup::'
            exit "$status"
          fi

      - name: Inspect feature-linked APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          mkdir -p artifacts/m3d-tauri-link
          cp "$APK" artifacts/m3d-tauri-link/
          unzip -l "$APK" | tee artifacts/m3d-tauri-link/apk-contents.txt
          unzip -o "$APK" 'lib/arm64-v8a/libtaurin4_lib.so' -d "$RUNNER_TEMP/m3d-apk" >/dev/null
          file "$RUNNER_TEMP/m3d-apk/lib/arm64-v8a/libtaurin4_lib.so" | tee artifacts/m3d-tauri-link/native-lib.txt
          ls -lh "$APK" "$RUNNER_TEMP/m3d-apk/lib/arm64-v8a/libtaurin4_lib.so" | tee artifacts/m3d-tauri-link/sizes.txt
          strings "$RUNNER_TEMP/m3d-apk/lib/arm64-v8a/libtaurin4_lib.so" | grep -Fq 'The server is shutting down. Please reconnect shortly.'
          echo 'feature_linked_authoritative_openmmo=true' | tee artifacts/m3d-tauri-link/result.txt

      - name: Upload Tauri linkage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: idea2-m3d-openmmo-tauri-link
          path: |
            embedded-tauri-controller-test.log
            artifacts/m3d-tauri-link/**
          if-no-files-found: warn
          retention-days: 14
