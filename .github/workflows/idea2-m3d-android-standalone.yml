name: idea2 M3-D Android Standalone E2E

on:
  pull_request:
    branches: ["idea2"]
    paths:
      - ".github/workflows/idea2-m3d-android-standalone.yml"
      - "src-tauri/**"
      - "src/App.tsx"
      - "src/app/platformRuntime.ts"
      - "src/openmmo/**"
      - "src/features/game/ui/OpenMmo*.tsx"
      - "src/features/game/ui/GameScreen.tsx"
      - "scripts/prepare-openmmo-embedded.py"
      - "scripts/prepare-openmmo-codec.mjs"
      - "scripts/ci/extract_openmmo_server_lib.py"
      - "scripts/ci/android_openmmo_runtime_acceptance.py"
      - "scripts/ci/android_openmmo_standalone_acceptance.py"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: idea2-m3d-android-standalone-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-standalone-e2e:
    name: Android standalone authoritative user flow
    runs-on: ubuntu-latest
    timeout-minutes: 65

    steps:
      - name: Checkout taurin4
        uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,x86_64-linux-android

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Resolve Android NDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          if [ ! -d "$ANDROID_HOME/ndk" ] || [ -z "$(ls -A "$ANDROID_HOME/ndk" 2>/dev/null)" ]; then
            NDK_PACKAGE="$(sdkmanager --list | awk '/^  ndk;[0-9]/{print $1}' | sort -V | tail -n 1)"
            test -n "$NDK_PACKAGE"
            sdkmanager "$NDK_PACKAGE"
          fi
          NDK_VERSION="$(ls -1 "$ANDROID_HOME/ndk" | sort -V | tail -n 1)"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "Using NDK $NDK_VERSION"

      - name: Install taurin4 dependencies
        run: npm install --no-audit --no-fund

      - name: Quality gate
        run: npm run check

      - name: Prepare exact pinned embedded OpenMMO source
        run: npm run openmmo:embedded:prepare

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri/openmmo
            src-tauri

      - name: Initialize Android project
        run: npm run android:init -- --ci

      - name: Build x86_64 standalone Android APK through canonical package script
        run: npm run android:build:debug -- --ci --target x86_64

      - name: Verify exact source, codec, and standalone APK linkage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C src-tauri/openmmo rev-parse HEAD)" = "950e081c178d920c10c51f2d31f60c1b3383c925"
          grep -q 'source_commit=950e081c178d920c10c51f2d31f60c1b3383c925' public/openmmo-wasm/PINNED_OPENMMO.txt
          test -f dist/openmmo-wasm/onlinerpg_shared.js
          test -f dist/openmmo-wasm/onlinerpg_shared_bg.wasm

          APK="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          TMP_APK_CHECK="$RUNNER_TEMP/taurin4-standalone-apk-check"
          mkdir -p "$TMP_APK_CHECK"
          unzip -o "$APK" 'lib/x86_64/libtaurin4_lib.so' -d "$TMP_APK_CHECK" >/dev/null
          file "$TMP_APK_CHECK/lib/x86_64/libtaurin4_lib.so"
          strings "$TMP_APK_CHECK/lib/x86_64/libtaurin4_lib.so" |
            grep -Fq 'The server is shutting down. Please reconnect shortly.'
          echo 'embedded_authoritative_openmmo=true'

      - name: Enable KVM for Android Emulator
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 666 /dev/kvm || true

      - name: Run standalone Android user-flow acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 4096M
          heap-size: 512
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          enable-hw-keyboard: true
          script: python scripts/ci/android_openmmo_standalone_acceptance.py

      - name: Upload standalone evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: idea2-m3d-android-standalone-e2e
          path: |
            artifacts/android-openmmo-standalone/**
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 14
