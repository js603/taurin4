name: idea2 Windows Human Acceptance E2E

on:
  pull_request:
    branches: ["idea2"]
    paths:
      - "e2e/**"
      - ".github/workflows/idea2-windows-human-e2e.yml"
      - "src-tauri/**"
      - "src/App.tsx"
      - "src/openmmo/**"
      - "src/features/game/ui/OpenMmo*.tsx"
      - "src/features/game/ui/GameScreen.tsx"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: idea2-windows-human-e2e-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-human-e2e:
    name: Windows Tauri real OpenMMO acceptance
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout taurin4
        uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Checkout pinned OpenMMO with partial sparse clone
        shell: bash
        run: |
          set -euo pipefail
          git init openmmo
          git -C openmmo remote add origin https://github.com/Julian-adv/OpenMMO.git
          git -C openmmo sparse-checkout init --cone
          git -C openmmo sparse-checkout set \
            .cargo \
            agent-client \
            server \
            shared \
            terrain \
            tools \
            data-src \
            data \
            client/public/models/objects
          git -C openmmo fetch --depth=1 --filter=blob:none origin 950e081c178d920c10c51f2d31f60c1b3383c925
          git -C openmmo checkout --detach FETCH_HEAD
          test "$(git -C openmmo rev-parse HEAD)" = "950e081c178d920c10c51f2d31f60c1b3383c925"
          test -f openmmo/Cargo.toml
          test -f openmmo/Cargo.lock

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            openmmo
            src-tauri

      - name: Install taurin4 dependencies
        run: npm install --no-audit --no-fund

      - name: Install WebDriverIO acceptance dependencies
        working-directory: e2e
        run: npm install --no-audit --no-fund

      - name: Build pinned OpenMMO server
        working-directory: openmmo
        run: cargo build -p onlinerpg-server --locked

      - name: Build pinned shared codec for Node seed
        working-directory: openmmo/shared
        shell: bash
        run: |
          wasm-pack build \
            --target nodejs \
            --release \
            --out-dir ../../.tmp/openmmo-wasm

      - name: Prepare pinned browser codec
        shell: pwsh
        run: |
          $env:OPENMMO_SOURCE_DIR = (Resolve-Path "openmmo").Path
          npm run openmmo:codec

      - name: Build real Tauri debug app
        run: npm run tauri -- build --debug --no-bundle

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - name: Install matching Edge WebDriver
        shell: pwsh
        run: |
          cargo install --git https://github.com/chippers/msedgedriver-tool
          & "$HOME\.cargo\bin\msedgedriver-tool.exe"
          $PWD.Path >> $env:GITHUB_PATH

      - name: Run server seed and actual Tauri WebView2 acceptance
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item "openmmo\data\npc_token" -Force -ErrorAction SilentlyContinue
          Remove-Item "openmmo\data\game_data.db" -Force -ErrorAction SilentlyContinue

          $terrain = Join-Path $env:RUNNER_TEMP "openmmo-empty-terrain"
          New-Item -ItemType Directory -Force -Path $terrain | Out-Null

          $stdout = Join-Path $env:RUNNER_TEMP "openmmo-e2e-server.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "openmmo-e2e-server.stderr.log"
          $exe = (Resolve-Path "openmmo\target\debug\onlinerpg-server.exe").Path
          $working = (Resolve-Path "openmmo").Path
          $serverArgs = @("--port","10006","--terrain-port","10007","--bind","127.0.0.1","--api-bind","127.0.0.1","--terrain-dir",$terrain)

          $process = $null
          try {
            $process = Start-Process -FilePath $exe -ArgumentList $serverArgs -WorkingDirectory $working -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru

            $ready = $false
            for ($attempt = 0; $attempt -lt 120; $attempt++) {
              if ($process.HasExited) {
                throw "OpenMMO server exited before becoming ready."
              }

              if ((Test-Path "openmmo\data\npc_token") -and (Select-String -Path $stdout -Pattern "MMORPG Server listening on: 127.0.0.1:10006" -Quiet -ErrorAction SilentlyContinue)) {
                $ready = $true
                break
              }

              Start-Sleep -Milliseconds 250
            }

            if (-not $ready) {
              throw "OpenMMO server did not become ready."
            }

            $token = (Get-Content "openmmo\data\npc_token" -Raw).Trim()
            if (-not $token) {
              throw "OpenMMO NPC token is empty."
            }

            $env:OPENMMO_SERVER_URL = "ws://127.0.0.1:10006"
            $env:OPENMMO_NPC_TOKEN = $token
            $env:OPENMMO_WASM_MODULE = (Resolve-Path ".tmp\openmmo-wasm\onlinerpg_shared.js").Path

            $env:TAURIN4_OPENMMO_SERVER_URL = "ws://127.0.0.1:10006"
            $env:TAURIN4_OPENMMO_ACCOUNT = "npc_idea2_dungeon"
            $env:TAURIN4_OPENMMO_NPC_TOKEN = $token
            $env:TAURIN4_OPENMMO_AUTOSTART = "1"

            Write-Host "===== Seed real old_crypt character ====="
            npx vitest run src/openmmo/real.integration.test.ts -t "enters old_crypt and kills a real server-spawned kobold"
            if ($LASTEXITCODE -ne 0) {
              throw "Real old_crypt seed failed with exit code $LASTEXITCODE"
            }

            if ($process.HasExited) {
              throw "OpenMMO server exited after seed."
            }

            Write-Host "===== Actual Tauri WebView2 acceptance ====="
            Push-Location "e2e"
            try {
              npm test
              if ($LASTEXITCODE -ne 0) {
                throw "Tauri WebView2 acceptance failed with exit code $LASTEXITCODE"
              }
            } finally {
              Pop-Location
            }
          } finally {
            if ($null -ne $process -and -not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              $process.WaitForExit()
            }

            Write-Host "===== OpenMMO stdout ====="
            Get-Content $stdout -ErrorAction SilentlyContinue
            Write-Host "===== OpenMMO stderr ====="
            Get-Content $stderr -ErrorAction SilentlyContinue
          }

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: idea2-m3b-windows-human-e2e
          path: |
            e2e/artifacts/**
            ${{ runner.temp }}/openmmo-e2e-server.stdout.log
            ${{ runner.temp }}/openmmo-e2e-server.stderr.log
          if-no-files-found: warn
          retention-days: 14
