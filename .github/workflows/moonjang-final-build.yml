name: Moonjang Final Mobile Build

on:
  push:
    branches: ["moonjang-ga-mobile"]
    paths: [".github/workflows/moonjang-final-build.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moonjang-final-${{ github.ref }}
  cancel-in-progress: true

env:
  MOONJANG_TREE: 4d852188eaece5be3510721e70efd088811a1417

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Restore Moonjang source from verified Git tree
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; tree=os.environ['MOONJANG_TREE']; token=os.environ['GH_TOKEN']
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req) as r:return json.load(r)
          data=get(f'https://api.github.com/repos/{repo}/git/trees/{tree}?recursive=1')
          if data.get('truncated'): raise SystemExit('Git tree response truncated')
          count=0
          for item in data['tree']:
              path=item['path']
              if item['type']!='blob' or not path.startswith('moonjang-production/'): continue
              blob=get(item['url']); raw=base64.b64decode(blob['content'])
              p=pathlib.Path(path);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(raw);count+=1
          if count < 20: raise SystemExit(f'incomplete source tree: {count} files')
          print('restored',count,'files')
          PY
          cd moonjang-production
          cat ci-parts/app.*.part > src/App.tsx
          cat ci-parts/styles.*.part > src/styles.css
          cat ci-parts/localserver.*.part > server/local_sqlite_server.py
          cat ci-parts/worker.*.part > cloudflare/src/index.ts
          chmod +x server/local_sqlite_server.py server/smoke_test.py
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install app dependencies
        working-directory: moonjang-production
        run: npm install --no-audit --no-fund
      - name: Lint, unit test, and web build
        working-directory: moonjang-production
        env:
          VITE_INTERNAL_TEST: "true"
          VITE_API_BASE: http://127.0.0.1:8787
        run: npm run check
      - name: Typecheck Cloudflare D1 API
        working-directory: moonjang-production/cloudflare
        run: npm install --no-audit --no-fund && npm run typecheck
      - name: SQLite security/regression smoke
        working-directory: moonjang-production
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/moonjang-smoke.db
          python3 server/local_sqlite_server.py --db /tmp/moonjang-smoke.db --port 8787 --quiet &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..80}; do curl -fsS http://127.0.0.1:8787/health >/dev/null && break || sleep .1; done
          python3 server/smoke_test.py
          kill $PID; wait $PID 2>/dev/null || true; trap - EXIT
      - name: Install Playwright Chromium
        working-directory: moonjang-production
        run: npx playwright install --with-deps chromium
      - name: Browser E2E
        working-directory: moonjang-production
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/moonjang-e2e.db
          python3 server/local_sqlite_server.py --db /tmp/moonjang-e2e.db --port 8787 --quiet &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..80}; do curl -fsS http://127.0.0.1:8787/health >/dev/null && break || sleep .1; done
          VITE_INTERNAL_TEST=true VITE_API_BASE=http://127.0.0.1:8787 npm run e2e

  android:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Restore Moonjang source
        env: { GH_TOKEN: "${{ github.token }}" }
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,json,os,pathlib,urllib.request
          repo=os.environ['GITHUB_REPOSITORY'];tree=os.environ['MOONJANG_TREE'];token=os.environ['GH_TOKEN'];h={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def g(u):
            r=urllib.request.Request(u,headers=h)
            with urllib.request.urlopen(r) as f:return json.load(f)
          d=g(f'https://api.github.com/repos/{repo}/git/trees/{tree}?recursive=1')
          for x in d['tree']:
            if x['type']=='blob' and x['path'].startswith('moonjang-production/'):
              b=g(x['url']);p=pathlib.Path(x['path']);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(base64.b64decode(b['content']))
          PY
          cd moonjang-production
          cat ci-parts/app.*.part > src/App.tsx
          cat ci-parts/styles.*.part > src/styles.css
          cat ci-parts/localserver.*.part > server/local_sqlite_server.py
          cat ci-parts/worker.*.part > cloudflare/src/index.ts
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v4
        with: { packages: platform-tools }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Resolve Android NDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          P="$(sdkmanager --list | awk '/^  ndk;[0-9]/{print $1}' | sort -V | tail -n 1)"; test -n "$P"; sdkmanager "$P"
          V="$(ls -1 "$ANDROID_HOME/ndk" | sort -V | tail -n 1)"; echo "NDK_HOME=$ANDROID_HOME/ndk/$V" >> "$GITHUB_ENV"
      - name: Install dependencies and initialize Android
        working-directory: moonjang-production
        run: |
          npm install --no-audit --no-fund
          npm run tauri -- icon src-tauri/icons/icon.png
          npm run tauri -- android init --ci
          python3 scripts/ci/patch_android_debug.py
      - name: Build internal APK
        working-directory: moonjang-production
        env:
          VITE_INTERNAL_TEST: "true"
          VITE_API_BASE: http://10.0.2.2:8787
        run: npm run tauri -- android build --debug --apk --ci -vv
      - name: Stage APK
        working-directory: moonjang-production
        shell: bash
        run: |
          mkdir -p artifacts/android
          APK="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)"; test -s "$APK"
          cp "$APK" artifacts/android/moonjang-ga-1.0.0-internal.apk
          sha256sum artifacts/android/*.apk > artifacts/android/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: moonjang-android-debug-apk
          path: moonjang-production/artifacts/android/
          if-no-files-found: error
          retention-days: 30

  ios:
    needs: quality
    runs-on: macos-latest
    env:
      APPLE_DEVELOPMENT_TEAM: "0000000000"
    steps:
      - uses: actions/checkout@v5
      - name: Restore Moonjang source
        env: { GH_TOKEN: "${{ github.token }}" }
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,json,os,pathlib,urllib.request
          repo=os.environ['GITHUB_REPOSITORY'];tree=os.environ['MOONJANG_TREE'];token=os.environ['GH_TOKEN'];h={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def g(u):
            r=urllib.request.Request(u,headers=h)
            with urllib.request.urlopen(r) as f:return json.load(f)
          d=g(f'https://api.github.com/repos/{repo}/git/trees/{tree}?recursive=1')
          for x in d['tree']:
            if x['type']=='blob' and x['path'].startswith('moonjang-production/'):
              b=g(x['url']);p=pathlib.Path(x['path']);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(base64.b64decode(b['content']))
          PY
          cd moonjang-production
          cat ci-parts/app.*.part > src/App.tsx
          cat ci-parts/styles.*.part > src/styles.css
          cat ci-parts/localserver.*.part > server/local_sqlite_server.py
          cat ci-parts/worker.*.part > cloudflare/src/index.ts
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - name: Install dependencies and initialize iOS
        working-directory: moonjang-production
        run: |
          npm install --no-audit --no-fund
          brew install xcodegen cocoapods
          npm run tauri -- icon src-tauri/icons/icon.png
          npm run tauri -- ios init --ci -vv
      - name: Build unsigned iOS package
        working-directory: moonjang-production
        env:
          VITE_INTERNAL_TEST: "true"
          VITE_API_BASE: http://127.0.0.1:8787
        run: npm run tauri -- ios build --no-sign --ci -vv
      - name: Stage unsigned iOS archive
        working-directory: moonjang-production
        shell: bash
        run: |
          mkdir -p artifacts/ios
          find src-tauri/gen/apple/build -type f -name '*.ipa' -exec cp {} artifacts/ios/ \; || true
          A="$(find src-tauri/gen/apple/build -type d -name '*.xcarchive' | head -n 1 || true)"
          if [ -n "$A" ]; then ditto -c -k --sequesterRsrc --keepParent "$A" artifacts/ios/moonjang-ga-1.0.0-unsigned.xcarchive.zip; fi
          if ! find artifacts/ios -type f | grep -Eq '\.(ipa|zip)$'; then echo 'No iOS package produced' >&2; exit 1; fi
          shasum -a 256 artifacts/ios/* > artifacts/ios/SHA256SUMS.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: moonjang-ios-unsigned
          path: moonjang-production/artifacts/ios/
          if-no-files-found: error
          retention-days: 30
