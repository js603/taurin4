name: idea2 OpenMMO M1.5 Runtime Audit

on:
  push:
    branches: ["idea2"]
    paths:
      - ".github/workflows/idea2-openmmo-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: idea2-openmmo-audit
  cancel-in-progress: true

jobs:
  runtime-smoke:
    name: Pinned OpenMMO runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout idea2
        uses: actions/checkout@v5
        with:
          path: taurin4

      - name: Checkout pinned OpenMMO
        uses: actions/checkout@v5
        with:
          repository: Julian-adv/OpenMMO
          ref: 950e081c178d920c10c51f2d31f60c1b3383c925
          path: openmmo
          lfs: false
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: openmmo

      - name: Build original server and agent client
        working-directory: openmmo
        run: cargo build -p onlinerpg-server -p agent-client --locked

      - name: Prepare isolated no-terrain runtime
        working-directory: openmmo
        shell: bash
        run: |
          set -euo pipefail
          rm -f data/npc_token data/game_data.db
          rm -rf "$RUNNER_TEMP/openmmo-empty-terrain"
          mkdir -p "$RUNNER_TEMP/openmmo-empty-terrain"

          cat > agent-client/data/config.toml <<'EOF'
          server = "ws://127.0.0.1:10006"
          terrain = "../data/terrain"
          auto_update = false
          max_concurrent = 1
          request_timeout_secs = 10

          [auth]
          mode = "npc_token"

          [[npcs]]
          account = "npc_m15_audit"
          character_name = "M15Audit"
          character_class = "knight"
          gender = "male"
          llm = "none"
          always_active = false
          always_sprint = false
          EOF

      - name: Start original server without Google OAuth or terrain bake
        working-directory: openmmo
        shell: bash
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/openmmo-server.log"

          ./target/debug/onlinerpg-server \
            --port 10006 \
            --terrain-port 10007 \
            --bind 127.0.0.1 \
            --api-bind 127.0.0.1 \
            --terrain-dir "$RUNNER_TEMP/openmmo-empty-terrain" \
            > "$RUNNER_TEMP/openmmo-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/openmmo-server.pid"

          # Probe the HTTP listener only. A raw TCP probe on 10006 looks like a
          # broken WebSocket handshake in the original server log.
          for _ in $(seq 1 120); do
            if curl -fsS -o /dev/null http://127.0.0.1:10007/api/terrain/height/0/0; then
              break
            fi
            if grep -q "Terrain REST API listening on:" "$RUNNER_TEMP/openmmo-server.log"; then
              break
            fi
            sleep 0.25
          done

          grep -q "MMORPG Server listening on: 127.0.0.1:10006" "$RUNNER_TEMP/openmmo-server.log"
          grep -q "Terrain REST API listening on: 127.0.0.1:10007" "$RUNNER_TEMP/openmmo-server.log"
          grep -q "Google sign-in disabled" "$RUNNER_TEMP/openmmo-server.log"
          test -s data/npc_token
          test -f data/game_data.db

      - name: Bootstrap original NPC account and character
        working-directory: openmmo/agent-client
        shell: bash
        run: |
          set +e
          timeout 6s ../target/debug/agent-client > "$RUNNER_TEMP/openmmo-agent-bootstrap.log" 2>&1
          status=$?
          set -e

          cat "$RUNNER_TEMP/openmmo-agent-bootstrap.log"
          grep -q "Connected" "$RUNNER_TEMP/openmmo-agent-bootstrap.log"
          grep -q "Authenticated. 0 character(s)" "$RUNNER_TEMP/openmmo-agent-bootstrap.log"
          grep -q "Roll 1/20:" "$RUNNER_TEMP/openmmo-agent-bootstrap.log"
          grep -q "Created character 'M15Audit'" "$RUNNER_TEMP/openmmo-agent-bootstrap.log"
          grep -q "Running in direct mode" "$RUNNER_TEMP/openmmo-agent-bootstrap.log"

          if [[ "$status" -ne 0 && "$status" -ne 124 ]]; then
            echo "bootstrap agent exited with unexpected status $status" >&2
            exit "$status"
          fi

      - name: Verify persisted audit character
        working-directory: openmmo
        shell: bash
        run: |
          python3 - <<'PY'
          import sqlite3
          db = sqlite3.connect("data/game_data.db")
          rows = db.execute(
              "select id, account_name, character_name, class, gender from characters where account_name=?",
              ("npc_m15_audit",)
          ).fetchall()
          print("audit characters:", rows)
          assert rows, "agent authentication did not create/persist a character"
          assert rows[0][2] == "M15Audit"
          PY

      - name: Re-enter existing character through original in-game path
        working-directory: openmmo/agent-client
        shell: bash
        run: |
          # llm=none is OpenMMO's deliberate direct-control mode and therefore
          # does not send EnterGame. The character already exists now. Enabling
          # an LLM mode selects the normal in-game path; EnterGame/JoinSuccess
          # happen before any background LLM response is required.
          sed -i 's/llm = "none"/llm = "codex"/' data/config.toml

          set +e
          timeout 12s ../target/debug/agent-client > "$RUNNER_TEMP/openmmo-agent-ingame.log" 2>&1
          status=$?
          set -e

          cat "$RUNNER_TEMP/openmmo-agent-ingame.log"
          grep -q "Authenticated. 1 character(s)" "$RUNNER_TEMP/openmmo-agent-ingame.log"
          grep -q "Entering game with character" "$RUNNER_TEMP/openmmo-agent-ingame.log"
          grep -q "Running in LLM-driven mode" "$RUNNER_TEMP/openmmo-agent-ingame.log"
          grep -q "Account 'npc_m15_audit' entered game as character 'M15Audit'" "$RUNNER_TEMP/openmmo-server.log"

          if [[ "$status" -ne 0 && "$status" -ne 124 ]]; then
            echo "in-game agent exited with unexpected status $status" >&2
            exit "$status"
          fi

      - name: Stop original server gracefully
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/openmmo-server.pid" ]]; then
            pid=$(cat "$RUNNER_TEMP/openmmo-server.pid")
            kill -TERM "$pid" 2>/dev/null || true
            for _ in $(seq 1 40); do
              kill -0 "$pid" 2>/dev/null || break
              sleep 0.25
            done
            kill -KILL "$pid" 2>/dev/null || true
          fi

          echo "===== SERVER LOG ====="
          cat "$RUNNER_TEMP/openmmo-server.log" 2>/dev/null || true
          echo "===== BOOTSTRAP AGENT LOG ====="
          cat "$RUNNER_TEMP/openmmo-agent-bootstrap.log" 2>/dev/null || true
          echo "===== IN-GAME AGENT LOG ====="
          cat "$RUNNER_TEMP/openmmo-agent-ingame.log" 2>/dev/null || true

      - name: Upload audit logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: idea2-openmmo-m15-runtime-logs
          path: |
            ${{ runner.temp }}/openmmo-server.log
            ${{ runner.temp }}/openmmo-agent-bootstrap.log
            ${{ runner.temp }}/openmmo-agent-ingame.log
          if-no-files-found: warn
          retention-days: 7


  browser-client:
    name: Original browser client build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout pinned OpenMMO
        uses: actions/checkout@v5
        with:
          repository: Julian-adv/OpenMMO
          ref: 950e081c178d920c10c51f2d31f60c1b3383c925
          path: openmmo
          lfs: false
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: openmmo/client/package-lock.json

      - name: Install browser client dependencies
        working-directory: openmmo/client
        run: npm ci

      - name: Build shared Rust WASM codec
        working-directory: openmmo/client
        run: npm run build:wasm

      - name: Validate browser client source
        working-directory: openmmo/client
        run: |
          npm run check
          npm run lint

      - name: Build original browser client without LFS asset fetch
        working-directory: openmmo/client
        env:
          VITE_GOOGLE_CLIENT_ID: m15-audit.invalid.apps.googleusercontent.com
          VITE_BACKEND_HOST: 127.0.0.1
        run: npx vite build

      - name: Smoke-start built browser client
        working-directory: openmmo/client
        shell: bash
        run: |
          set -euo pipefail
          npx vite preview --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/openmmo-client-preview.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/openmmo-client-preview.pid"

          for _ in $(seq 1 80); do
            if curl -fsS http://127.0.0.1:4173/ > "$RUNNER_TEMP/openmmo-client-index.html"; then
              break
            fi
            sleep 0.25
          done

          grep -q '<div id="app">' "$RUNNER_TEMP/openmmo-client-index.html"
          grep -q 'src="/assets/' "$RUNNER_TEMP/openmmo-client-index.html"

      - name: Record OAuth and asset boundary
        working-directory: openmmo
        shell: bash
        run: |
          set -euo pipefail
          grep -q "VITE_GOOGLE_CLIENT_ID is not configured" client/src/lib/components/LoginScreen.svelte
          grep -q "https://accounts.google.com/gsi/client" client/src/lib/components/LoginScreen.svelte
          grep -q "bash tools/fetch-assets.sh" README.md
          grep -q "262,144" README.md
          grep -q "73 GB" README.md

      - name: Stop browser preview
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/openmmo-client-preview.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/openmmo-client-preview.pid")" 2>/dev/null || true
          fi
          cat "$RUNNER_TEMP/openmmo-client-preview.log" 2>/dev/null || true

      - name: Upload browser audit logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: idea2-openmmo-m15-browser-audit
          path: |
            ${{ runner.temp }}/openmmo-client-preview.log
            ${{ runner.temp }}/openmmo-client-index.html
          if-no-files-found: warn
          retention-days: 7
