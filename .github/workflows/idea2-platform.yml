name: idea2 Windows + Android

on:
  push:
    branches: ["idea2"]
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: idea2-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-core:
    name: Shared Rust core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Test network protocol
        run: cargo test --manifest-path crates/game-network/Cargo.toml
      - name: Test persistence contracts
        run: cargo test --manifest-path crates/game-persistence/Cargo.toml
      - name: Test game host core
        run: cargo test --manifest-path crates/game-server-core/Cargo.toml

  windows:
    name: Windows client + host compile
    needs: shared-core
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Web quality gate
        run: npm run check
      - name: Compile Tauri Windows app with embedded host core
        run: npm run tauri -- build --debug --no-bundle

  android:
    name: Android client + host APK
    needs: shared-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Resolve Android NDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          if [ ! -d "$ANDROID_HOME/ndk" ] || [ -z "$(ls -A "$ANDROID_HOME/ndk" 2>/dev/null)" ]; then
            NDK_PACKAGE="$(sdkmanager --list | awk '/^  ndk;[0-9]/{print $1}' | sort -V | tail -n 1)"
            test -n "$NDK_PACKAGE"
            sdkmanager "$NDK_PACKAGE"
          fi
          NDK_VERSION="$(ls -1 "$ANDROID_HOME/ndk" | sort -V | tail -n 1)"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Initialize Android project
        run: npm run tauri -- android init --ci
      - name: Build Android debug APK with embedded host core
        run: npm run tauri -- android build --debug --apk --ci
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: idea2-android-host-debug-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
