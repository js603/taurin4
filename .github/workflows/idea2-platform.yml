name: idea2 Windows + Android

on:
  push:
    branches: ["idea2"]
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: idea2-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-core:
    name: Shared Rust core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Test network protocol
        run: cargo test --manifest-path crates/game-network/Cargo.toml
      - name: Test persistence contracts
        run: cargo test --manifest-path crates/game-persistence/Cargo.toml
      - name: Test game host core
        run: cargo test --manifest-path crates/game-server-core/Cargo.toml

  windows:
    name: Windows standalone debug executable
    needs: shared-core
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Web quality gate
        run: npm run check
      - name: Build Tauri Windows app with embedded authoritative OpenMMO
        run: npm run tauri:build -- --debug --no-bundle
      - name: Verify Windows executable contains embedded authoritative core
        shell: pwsh
        run: |
          $source = "src-tauri/target/debug/taurin4.exe"
          if (-not (Test-Path -Path $source -PathType Leaf)) {
            throw "Windows debug executable was not produced: $source"
          }
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $source))
          $text = [System.Text.Encoding]::ASCII.GetString($bytes)
          if (-not $text.Contains('The server is shutting down. Please reconnect shortly.')) {
            throw "Windows executable does not contain the authoritative OpenMMO core marker."
          }
          if (-not (Test-Path "dist/openmmo-wasm/onlinerpg_shared.js")) {
            throw "Pinned browser codec JavaScript is missing from the packaged frontend."
          }
          if (-not (Test-Path "dist/openmmo-wasm/onlinerpg_shared_bg.wasm")) {
            throw "Pinned browser codec WASM is missing from the packaged frontend."
          }
      - name: Stage Windows standalone package
        shell: pwsh
        run: |
          $source = "src-tauri/target/debug/taurin4.exe"
          $dest = "artifacts/idea2-windows-standalone"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -Path $source -Destination "$dest/taurin4.exe"
          @(
            "taurin4 idea2 Standalone (Windows x64)"
            ""
            "Run taurin4.exe and select Singleplayer."
            "The pinned authoritative OpenMMO core runs inside this process."
            "No separate OpenMMO server, server URL, or auth token is required for Singleplayer."
          ) | Set-Content -Path "$dest/README_STANDALONE.txt" -Encoding utf8
          $hash = Get-FileHash -Path "$dest/taurin4.exe" -Algorithm SHA256
          "$($hash.Hash.ToLowerInvariant())  taurin4.exe" |
            Set-Content -Path "$dest/SHA256SUMS.txt" -Encoding ascii
      - name: Upload Windows standalone package
        uses: actions/upload-artifact@v4
        with:
          name: idea2-windows-standalone-debug
          path: artifacts/idea2-windows-standalone/
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android standalone APK
    needs: shared-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android,wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Resolve Android NDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          if [ ! -d "$ANDROID_HOME/ndk" ] || [ -z "$(ls -A "$ANDROID_HOME/ndk" 2>/dev/null)" ]; then
            NDK_PACKAGE="$(sdkmanager --list | awk '/^  ndk;[0-9]/{print $1}' | sort -V | tail -n 1)"
            test -n "$NDK_PACKAGE"
            sdkmanager "$NDK_PACKAGE"
          fi
          NDK_VERSION="$(ls -1 "$ANDROID_HOME/ndk" | sort -V | tail -n 1)"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Initialize Android project
        run: npm run android:init -- --ci
      - name: Build Android standalone debug APK
        run: npm run android:build:debug -- --ci
      - name: Verify Android APK contains authoritative embedded core
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          CHECK_DIR="$RUNNER_TEMP/taurin4-android-core-check"
          mkdir -p "$CHECK_DIR"
          unzip -o "$APK" 'lib/arm64-v8a/libtaurin4_lib.so' -d "$CHECK_DIR" >/dev/null
          strings "$CHECK_DIR/lib/arm64-v8a/libtaurin4_lib.so" |
            grep -Fq 'The server is shutting down. Please reconnect shortly.'
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: idea2-android-standalone-debug-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
