name: idea2 M3-D Android OpenMMO Server Feasibility

on:
  pull_request:
    branches: ["idea2"]
    paths:
      - ".github/workflows/idea2-m3d-android-server-feasibility.yml"
      - "scripts/ci/android_openmmo_server_runtime_probe.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-server-cross-compile:
    name: Pinned OpenMMO server Android compile + runtime
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout taurin4
        uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Resolve Android NDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          if [ ! -d "$ANDROID_HOME/ndk" ] || [ -z "$(ls -A "$ANDROID_HOME/ndk" 2>/dev/null)" ]; then
            NDK_PACKAGE="$(sdkmanager --list | awk '/^  ndk;[0-9]/{print $1}' | sort -V | tail -n 1)"
            test -n "$NDK_PACKAGE"
            sdkmanager "$NDK_PACKAGE"
          fi
          NDK_VERSION="$(ls -1 "$ANDROID_HOME/ndk" | sort -V | tail -n 1)"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_LLVM_TOOLCHAIN=$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_ENV"
          echo "Using NDK $NDK_VERSION"

      - name: Checkout exact pinned OpenMMO
        shell: bash
        run: |
          set -euo pipefail
          git init openmmo
          git -C openmmo remote add origin https://github.com/Julian-adv/OpenMMO.git
          git -C openmmo sparse-checkout init --cone
          git -C openmmo sparse-checkout set \
            .cargo \
            agent-client \
            server \
            shared \
            terrain \
            tools \
            data-src \
            data \
            client/public/models/objects
          git -C openmmo fetch --depth=1 --filter=blob:none origin 950e081c178d920c10c51f2d31f60c1b3383c925
          git -C openmmo checkout --detach FETCH_HEAD
          test "$(git -C openmmo rev-parse HEAD)" = "950e081c178d920c10c51f2d31f60c1b3383c925"
          test -f openmmo/agent-client/Cargo.toml
          test -f openmmo/server/Cargo.toml
          test -f openmmo/shared/Cargo.toml
          test -f openmmo/terrain/Cargo.toml
          test -f openmmo/tools/terrain-gen/Cargo.toml

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: openmmo

      - name: Configure Android linkers
        shell: bash
        run: |
          set -euo pipefail
          API=26
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$ANDROID_LLVM_TOOLCHAIN/aarch64-linux-android${API}-clang" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$ANDROID_LLVM_TOOLCHAIN/aarch64-linux-android${API}-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$ANDROID_LLVM_TOOLCHAIN/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=$ANDROID_LLVM_TOOLCHAIN/x86_64-linux-android${API}-clang" >> "$GITHUB_ENV"
          echo "CC_x86_64_linux_android=$ANDROID_LLVM_TOOLCHAIN/x86_64-linux-android${API}-clang" >> "$GITHUB_ENV"
          echo "AR_x86_64_linux_android=$ANDROID_LLVM_TOOLCHAIN/llvm-ar" >> "$GITHUB_ENV"
          test -x "$ANDROID_LLVM_TOOLCHAIN/aarch64-linux-android${API}-clang"
          test -x "$ANDROID_LLVM_TOOLCHAIN/x86_64-linux-android${API}-clang"

      - name: Check pinned shared and terrain crates for Android ARM64
        working-directory: openmmo
        shell: bash
        run: |
          set -euo pipefail
          cargo check -p onlinerpg-shared --target aarch64-linux-android --locked
          cargo check -p onlinerpg-terrain --target aarch64-linux-android --locked

      - name: Check original pinned server executable for Android ARM64
        working-directory: openmmo
        shell: bash
        run: |
          set -euo pipefail
          cargo check -p onlinerpg-server --target aarch64-linux-android --locked

      - name: Build original pinned server executable for Android ARM64
        working-directory: openmmo
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p onlinerpg-server --target aarch64-linux-android --locked
          SERVER=target/aarch64-linux-android/debug/onlinerpg-server
          test -f "$SERVER"
          file "$SERVER"
          readelf -h "$SERVER" | tee "$GITHUB_WORKSPACE/android-server-arm64-elf.txt"
          ls -lh "$SERVER" | tee "$GITHUB_WORKSPACE/android-server-arm64-size.txt"

      - name: Build emulator-matching original server executable
        working-directory: openmmo
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p onlinerpg-server --target x86_64-linux-android --locked
          SERVER=target/x86_64-linux-android/debug/onlinerpg-server
          RUNTIME_SERVER="$GITHUB_WORKSPACE/android-openmmo-server-x86_64"
          test -f "$SERVER"
          cp "$SERVER" "$RUNTIME_SERVER"
          "$ANDROID_LLVM_TOOLCHAIN/llvm-strip" "$RUNTIME_SERVER"
          chmod 755 "$RUNTIME_SERVER"
          file "$RUNTIME_SERVER" | tee "$GITHUB_WORKSPACE/android-server-runtime-file.txt"
          readelf -h "$RUNTIME_SERVER" | tee "$GITHUB_WORKSPACE/android-server-runtime-elf.txt"
          ls -lh "$RUNTIME_SERVER" | tee "$GITHUB_WORKSPACE/android-server-runtime-size.txt"

      - name: Enable KVM for Android Emulator
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 666 /dev/kvm || true

      - name: Execute original pinned server inside Android and probe WebSocket
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 4096M
          heap-size: 512
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: OPENMMO_DIR="$GITHUB_WORKSPACE/openmmo" ANDROID_SERVER_BIN="$GITHUB_WORKSPACE/android-openmmo-server-x86_64" bash scripts/ci/android_openmmo_server_runtime_probe.sh

      - name: Upload feasibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: idea2-m3d-android-server-feasibility
          path: |
            android-server-arm64-elf.txt
            android-server-arm64-size.txt
            android-server-runtime-file.txt
            android-server-runtime-elf.txt
            android-server-runtime-size.txt
            artifacts/android-openmmo-server-probe/**
          if-no-files-found: warn
          retention-days: 14
