name: idea2 validation

on:
  push:
    branches: ["idea2"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: idea2-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint, test, and build
        run: npm run check
