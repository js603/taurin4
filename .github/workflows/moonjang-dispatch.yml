name: Moonjang Rebuild Dispatcher

on:
  push:
    branches: ["moonjang-ga-mobile"]
    paths:
      - ".github/workflows/moonjang-dispatch.yml"
      - "moonjang-production/vitest.config.ts"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch latest Moonjang final build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run moonjang-final-build.yml --repo "$GITHUB_REPOSITORY" --ref moonjang-ga-mobile
